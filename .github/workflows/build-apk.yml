name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 25.3.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Initialize EAS project
        working-directory: artifacts/novel-reader
        run: eas init --non-interactive --force

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Build Android APK
        working-directory: artifacts/novel-reader
        run: eas build --platform android --profile preview --non-interactive --local
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # Local EAS builds do not preserve the preinstalled sentry-cli
          # in their fresh sandbox, so source-map upload is disabled here.
          SENTRY_DISABLE_AUTO_UPLOAD: "true"

      - name: Rename and Move APK
        working-directory: artifacts/novel-reader
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          REV=${{ github.run_number }}
          mkdir -p ../../dist
          APK_FILE=$(find . -maxdepth 1 -name "*.apk" -type f -print -quit)
          test -n "$APK_FILE"
          cp "$APK_FILE" "../../dist/NovelDR v${VERSION}rev${REV}.apk"
          echo "Build Complete: NovelDR v${VERSION}rev${REV}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovelDR-Build-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
