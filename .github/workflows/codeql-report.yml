name: CodeQL Report Generator

on:
  workflow_dispatch:
  push:
    branches: [ main, Prod, Prod-Dev, Overhaul, Dev1 ]
  pull_request:
    branches: [ main, Prod, Prod-Dev, Overhaul, Dev1 ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          upload: false               # we'll upload manually as an artifact
          output: codeql-results      # directory where SARIF will be saved

      - name: Generate human-readable summary with jq
        run: |
          echo "=== CodeQL Scan Report ===" > codeql-summary.txt
          echo "" >> codeql-summary.txt

          # Check if the SARIF file exists
          SARIF_FILE="codeql-results/codeql-results.sarif"
          if [ ! -f "$SARIF_FILE" ]; then
            echo "SARIF file not found. Skipping summary." >> codeql-summary.txt
            exit 0
          fi

          # Extract each alert: rule ID, message, location, and line number
          jq -r '.runs[].results[] | 
            "---\nRule: \(.ruleId)\nMessage: \(.message.text)\nLocation: \(.locations[0].physicalLocation.artifactLocation.uri) (line \(.locations[0].physicalLocation.region.startLine))\n" 
          ' "$SARIF_FILE" >> codeql-summary.txt

          # Count total alerts
          COUNT=$(jq '.runs[].results | length' "$SARIF_FILE")
          echo "---" >> codeql-summary.txt
          echo "Total alerts: $COUNT" >> codeql-summary.txt

          echo "" >> codeql-summary.txt
          echo "=== Raw SARIF (full details) ===" >> codeql-summary.txt
          cat "$SARIF_FILE" >> codeql-summary.txt

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-report
          path: |
            codeql-results/
            codeql-summary.txt
