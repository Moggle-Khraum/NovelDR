name: CodeQL Report Generator

on:
  workflow_dispatch:
  push:
    branches: [ main, Prod, Prod-Dev, Overhaul ]
  pull_request:
    branches: [ main, Prod, Prod-Dev, Overhaul ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: codeql-results

      - name: Install SARIF tools
        run: npm install -g sarif-tools

      - name: Generate human-readable summary
        run: |
          echo "=== CodeQL Scan Report ===" > codeql-summary.txt
          echo "" >> codeql-summary.txt
          sarif-tools summarise codeql-results/codeql-results.sarif >> codeql-summary.txt 2>&1 || echo "(No extra summary available)" >> codeql-summary.txt
          echo "" >> codeql-summary.txt
          echo "=== Raw SARIF (full details) ===" >> codeql-summary.txt
          cat codeql-results/codeql-results.sarif >> codeql-summary.txt

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-report
          path: |
            codeql-results/
            codeql-summary.txt
