name: Update Changelog & Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      changelog_entry:
        description: 'Manual changelog entry (optional - leave empty to auto-parse commits)'
        required: false
        type: string

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Get current version
        id: get-version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new-version
        run: |
          CURRENT=${{ steps.get-version.outputs.current_version }}
          BUMP=${{ github.event.inputs.version_bump }}
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          
          case $BUMP in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              ;;
          esac
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Parse commits since last tag
        id: parse-commits
        if: ${{ !github.event.inputs.changelog_entry }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --pretty=format:"%s")
          else
            COMMITS=$(git log $LAST_TAG..HEAD --oneline --pretty=format:"%s")
          fi
          
          CHANGELOG_TEXT=$(echo "$COMMITS" | awk '{print "- " $0}')
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set changelog text
        id: changelog-text
        run: |
          if [ -n "${{ github.event.inputs.changelog_entry }}" ]; then
            echo "text=${{ github.event.inputs.changelog_entry }}" >> $GITHUB_OUTPUT
          else
            echo "text=${{ steps.parse-commits.outputs.commits }}" >> $GITHUB_OUTPUT
          fi

      - name: Update CHANGELOG.md
        run: |
          VERSION=${{ steps.new-version.outputs.new_version }}
          DATE=$(date +%Y-%m-%d)
          
          # Create new changelog entry
          NEW_ENTRY="## [$VERSION] - $DATE

          ${{ steps.changelog-text.outputs.text }}
          
          "
          
          # Prepend to CHANGELOG.md
          echo "$NEW_ENTRY" > CHANGELOG.temp
          cat CHANGELOG.md >> CHANGELOG.temp
          mv CHANGELOG.temp CHANGELOG.md

      - name: Update package.json version
        run: |
          npm version ${{ github.event.inputs.version_bump }} --no-git-tag-version

      - name: Commit and tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add CHANGELOG.md package.json pnpm-lock.yaml
          git commit -m "chore: release v${{ steps.new-version.outputs.new_version }}"
          git tag v${{ steps.new-version.outputs.new_version }}
          git push origin main --tags
