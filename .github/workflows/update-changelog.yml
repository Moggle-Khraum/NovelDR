name: Update Changelog

on:
  workflow_dispatch:
    inputs:
      changelog_entry:
        description: 'Manual changelog entry (optional - leave empty to auto-parse commits)'
        required: false
        type: string

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse commits since last changelog update
        id: parse-commits
        if: ${{ !github.event.inputs.changelog_entry }}
        run: |
          LAST_CHANGELOG_COMMIT=$(git log --oneline --all --grep="docs: update changelog" | head -1 | cut -d' ' -f1)
          if [ -z "$LAST_CHANGELOG_COMMIT" ]; then
            COMMITS=$(git log --oneline --pretty=format:"%s")
          else
            COMMITS=$(git log $LAST_CHANGELOG_COMMIT..HEAD --oneline --pretty=format:"%s")
          fi
          
          CHANGELOG_TEXT=$(echo "$COMMITS" | awk '{print "- " $0}')
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set changelog text
        id: changelog-text
        run: |
          if [ -n "${{ github.event.inputs.changelog_entry }}" ]; then
            echo "text=${{ github.event.inputs.changelog_entry }}" >> $GITHUB_OUTPUT
          else
            echo "text=${{ steps.parse-commits.outputs.commits }}" >> $GITHUB_OUTPUT
          fi

      - name: Update CHANGELOG.md
        run: |
          DATE=$(date +%Y-%m-%d)
          
          # Create new changelog entry
          NEW_ENTRY="## $DATE

          ${{ steps.changelog-text.outputs.text }}
          
          "
          
          # Prepend to CHANGELOG.md
          echo "$NEW_ENTRY" > CHANGELOG.temp
          cat CHANGELOG.md >> CHANGELOG.temp
          mv CHANGELOG.temp CHANGELOG.md

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add CHANGELOG.md
          git commit -m "docs: update changelog"
          git push
